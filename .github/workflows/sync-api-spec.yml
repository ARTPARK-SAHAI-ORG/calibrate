name: Sync API spec

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-api-spec.yml"
      - "scripts/fetch_public_openapi.py"
      - "scripts/generate_sdk_docs.py"
      - "scripts/sdk_reference.py"
      - "docs/templates/**"
  schedule:
    # Refresh weekly so docs track backend deploys even without agentloop changes.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-api-spec]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Python SDK reference
        uses: actions/checkout@v4
        with:
          repository: dalmia/calibrate-python-sdk
          path: calibrate-python-sdk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout backend Fern overrides
        uses: actions/checkout@v4
        with:
          repository: ARTPARK-SAHAI-ORG/calibrate-backend
          path: calibrate-backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and normalize public OpenAPI spec
        env:
          PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL }}
          SDK_REFERENCE_PATH: calibrate-python-sdk/reference.md
          FERN_OVERRIDES_PATH: calibrate-backend/fern/openapi-overrides.yml
        run: python scripts/fetch_public_openapi.py

      - name: Open PR for generated docs if changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Sync public OpenAPI spec, SDK docs, and API URL templates.
          title: Sync public OpenAPI spec and SDK docs
          body: |
            Automated sync of generated API docs from `PUBLIC_API_BASE_URL` and
            Fern-generated Python SDK reference from `dalmia/calibrate-python-sdk`.

            Generated by the [Sync API spec](.github/workflows/sync-api-spec.yml) workflow.
          branch: automated/sync-api-spec
          delete-branch: true
          add-paths: |
            docs/api-reference/openapi.json
            docs/api-reference/introduction.mdx
            docs/reference/api-keys.mdx
            docs/reference/github-actions.mdx
            docs/sdk/**
            docs/docs.json
